apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Default configuration — uncomment lines as needed
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.capstashwallet.lite"

    defaultConfig {
        applicationId "com.capstashwallet.lite"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 42069
        versionName "4.20.69-lite"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Signing secrets live in ~/.gradle/gradle.properties (never commit them):
            //   CAPSTASH_RELEASE_STORE_FILE=capstash-release.keystore
            //   CAPSTASH_RELEASE_STORE_PASSWORD=...
            //   CAPSTASH_RELEASE_KEY_ALIAS=capstash
            //   CAPSTASH_RELEASE_KEY_PASSWORD=...
            if (project.hasProperty('CAPSTASH_RELEASE_STORE_PASSWORD')) {
                storeFile file(project.findProperty('CAPSTASH_RELEASE_STORE_FILE') ?: 'capstash-release.keystore')
                storePassword CAPSTASH_RELEASE_STORE_PASSWORD
                keyAlias project.findProperty('CAPSTASH_RELEASE_KEY_ALIAS') ?: 'capstash'
                keyPassword CAPSTASH_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}
dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
